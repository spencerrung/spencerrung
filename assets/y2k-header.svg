<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Spencer Rung — software, systems, and a little bit of stardust</title>
  <desc id="description">A glossy Y2K inspired banner in midnight blue, cyan, pink, and lime.</desc>
  <defs>
    <linearGradient id="sky" x1="70" y1="22" x2="1134" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05091A"/>
      <stop offset=".48" stop-color="#17114A"/>
      <stop offset="1" stop-color="#380C4A"/>
    </linearGradient>
    <linearGradient id="chrome" x1="280" y1="76" x2="840" y2="279" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".18" stop-color="#8DF6FF"/>
      <stop offset=".5" stop-color="#F4F5FF"/>
      <stop offset=".72" stop-color="#FF8BDF"/>
      <stop offset="1" stop-color="#70FFE1"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="translate(1001 98) rotate(130) scale(149 149)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FFFF"/>
      <stop offset=".3" stop-color="#78F7FF"/>
      <stop offset=".68" stop-color="#D03EFF"/>
      <stop offset="1" stop-color="#33106A"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#02030D" flood-opacity=".6"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#sky)"/>
  <path d="M-70 318C120 187 226 413 413 280C587 157 688 355 871 238C1032 135 1140 175 1282 83" stroke="#00E5FF" stroke-opacity=".28" stroke-width="2"/>
  <path d="M-83 342C119 211 222 428 417 304C592 190 696 378 874 260C1023 162 1135 199 1270 114" stroke="#FF3DB5" stroke-opacity=".22" stroke-width="2"/>
  <g fill="#D7FAFF" filter="url(#glow)">
    <circle cx="73" cy="77" r="2"/><circle cx="154" cy="130" r="2"/><circle cx="263" cy="47" r="1.5"/><circle cx="460" cy="63" r="2"/><circle cx="752" cy="45" r="1.5"/><circle cx="1079" cy="270" r="2"/><circle cx="1134" cy="44" r="1.5"/>
  </g>
  <g stroke="#A6FF00" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
    <path d="M99 222v20m-10-10h20"/><path d="M708 257v18m-9-9h18"/><path d="M1122 186v16m-8-8h16"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="1002" cy="98" r="89" fill="url(#orb)" stroke="#A6FF00" stroke-opacity=".8" stroke-width="2"/>
    <ellipse cx="972" cy="66" rx="37" ry="17" transform="rotate(-31 972 66)" fill="#fff" fill-opacity=".58"/>
    <path d="M900 193C949 160 1025 160 1090 194" stroke="#FF98E4" stroke-width="3" stroke-linecap="round"/>
    <path d="M920 204C967 177 1033 178 1070 204" stroke="#00E5FF" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <text x="82" y="145" fill="url(#chrome)" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="900" letter-spacing="-2">SPENCER RUNG</text>
    <text x="86" y="191" fill="#D7F0F7" font-family="monospace" font-size="18" letter-spacing="2.7">SOFTWARE · SYSTEMS · STARDUST</text>
    <rect x="84" y="223" width="461" height="38" rx="19" fill="#070C20" fill-opacity=".72" stroke="#00E5FF" stroke-opacity=".58"/>
    <text x="105" y="248" fill="#A6FF00" font-family="monospace" font-size="15" letter-spacing="1">BUILDING HUMAN-SCALE INTERNET THINGS</text>
  </g>
  <text x="84" y="309" fill="#A9C8DD" font-family="monospace" font-size="13">alucard.dev  //  est. somewhere between the web and the weird</text>
</svg>
